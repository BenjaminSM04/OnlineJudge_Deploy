name: Sincroniza los submódulos

on:
  # Todos los días a medianoche (UTC) y a mano desde la pestaña «Actions».
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: sincronizacion-submodulos-main
  cancel-in-progress: false

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      checks: read

    steps:
      - name: Obtiene main y sus submódulos
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Actualiza ambos submódulos a su main
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --remote --recursive
          echo "Backend: $(git -C OnlineJudge rev-parse HEAD)"
          echo "Frontend: $(git -C OnlineJudgeFE rev-parse HEAD)"

      - name: Termina si no hay cambios
        id: cambios
        shell: bash
        run: |
          if git diff --quiet -- OnlineJudge OnlineJudgeFE; then
            echo "hay=0" >> "$GITHUB_OUTPUT"
            echo "Los submódulos ya están sincronizados."
          else
            echo "hay=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Exige pruebas aprobadas del SHA exacto de ambos repositorios
        if: steps.cambios.outputs.hay == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_submodule_checks.py > compatibilidad-submodulos.json

      - name: Prueba la pareja candidata con el stack completo
        if: steps.cambios.outputs.hay == '1'
        run: bash scripts/verify_stack.sh lizardjudge-sync-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Guarda y publica únicamente los punteros comprobados
        if: steps.cambios.outputs.hay == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OnlineJudge OnlineJudgeFE
          git commit -m "Sincroniza los submódulos de backend y frontend"
          git push origin HEAD:main

      - name: Elimina el ensayo y sus volúmenes de prueba
        if: always() && steps.cambios.outputs.hay == '1'
        run: docker compose -p lizardjudge-sync-${{ github.run_id }}-${{ github.run_attempt }} --env-file .verification/ci.env down -v || true
