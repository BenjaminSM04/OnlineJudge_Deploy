name: Sincroniza los submódulos

on:
  # Se ejecuta automáticamente todos los días a la medianoche (UTC)
  schedule:
    - cron: '0 0 * * *'
  # Permite ejecutarlo manualmente desde la pestaña "Actions" en GitHub
  workflow_dispatch:

concurrency:
  group: sincronizacion-submodulos-main
  cancel-in-progress: false

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    
    steps:
      - name: Obtiene main y sus submódulos
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          # Usamos un fetch-depth 0 para asegurarnos de tener toda la historia git
          fetch-depth: 0
          
      - name: Actualiza ambos submódulos a main
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          # Actualiza los submódulos basados en la rama configurada en .gitmodules (main)
          git submodule update --init --remote --recursive
          echo "Backend: $(git -C OnlineJudge rev-parse HEAD)"
          echo "Frontend: $(git -C OnlineJudgeFE rev-parse HEAD)"
          
      - name: Guarda y publica los punteros actualizados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Añade los cambios y hace commit solo si hay modificaciones
          git add OnlineJudge OnlineJudgeFE
          if git diff --cached --quiet; then
            echo "Los submódulos ya están sincronizados."
            exit 0
          fi
          git commit -m "Sincroniza los submódulos de backend y frontend"
          
          # Sube los cambios al repositorio
          git push origin HEAD:main
