name: Verifica el despliegue con Docker Compose

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prueba el stack completo desde cero
        run: bash scripts/verify_stack.sh lizardjudge-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Muestra registros si algo falla
        if: failure()
        run: docker compose -p lizardjudge-ci-${{ github.run_id }}-${{ github.run_attempt }} --env-file .verification/ci.env logs --tail 200
      - name: Elimina el ensayo y sus volúmenes de prueba
        if: always()
        run: docker compose -p lizardjudge-ci-${{ github.run_id }}-${{ github.run_attempt }} --env-file .verification/ci.env down -v || true
