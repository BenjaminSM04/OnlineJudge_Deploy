# Uso exclusivo para preparar un destino vacío; no cambia la conexión del backend.
services:
  oj-postgres17:
    profiles: [migracion]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onlinejudge}
      POSTGRES_USER: ${POSTGRES_USER:-onlinejudge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Conserve la contraseña del despliegue en el entorno privado}
    volumes:
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 5s
      retries: 30
  oj-postgres10:
    profiles: [migracion]
    image: postgres:10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onlinejudge}
      POSTGRES_USER: ${POSTGRES_USER:-onlinejudge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Conserve la contraseña del despliegue en el entorno privado}
    volumes:
      - pgdata10:/var/lib/postgresql/data
volumes:
  pgdata17:
    external: true
    name: ${OJ_PG17_VOLUME:?Seleccione un volumen nuevo separado}
  pgdata10:
    external: true
    name: ${OJ_PG10_VOLUME:?Identifique el volumen histórico real; no se infiere}
