services:
  oj-backend:
    environment:
      AI_TUTOR_MODEL_ENABLED: ${AI_TUTOR_MODEL_ENABLED:-0}
      AI_TUTOR_ENGINE_URL: http://oj-tutor:8080
      AI_TUTOR_ENGINE_TIMEOUT: ${AI_TUTOR_ENGINE_TIMEOUT:-10}
    networks: [default, tutor]
  oj-tutor:
    profiles: [tutor]
    build:
      context: .
      dockerfile: tutor_engine/Dockerfile
    image: lizardjudge-tutor:local
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    environment:
      MODEL_TIMEOUT_S: ${MODEL_TIMEOUT_S:-8}
    volumes: ['${TUTOR_MODEL_DIR:-./artifacts/tutor}:/models:ro']
    networks: [tutor]
  oj-model:
    profiles: [tutor]
    image: ${LLAMA_SERVER_IMAGE:-ghcr.io/ggml-org/llama.cpp:server@sha256:8c74db29f1a2bef3f0a331b52c4d6214601dfceed4bee0b94cc48b3b23ff257d}
    command: ['-m', '/models/model.gguf', '--host', '0.0.0.0', '--port', '8080', '-c', '4096', '-np', '1', '--threads', '2']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 3g
    cpus: 2
    tmpfs: [/tmp:size=64m]
    volumes: ['${TUTOR_MODEL_DIR:-./artifacts/tutor}:/models:ro']
    networks: [tutor]
networks:
  tutor:
    internal: true
