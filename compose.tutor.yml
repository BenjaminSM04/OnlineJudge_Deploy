# Tutor con modelo (opcional). Usa las imágenes públicas del motor y del modelo
# aprobado de la 2.2.3; el archivo .gguf ya viene dentro de la imagen del modelo.
#   docker compose -f docker-compose.yml -f compose.tutor.yml up -d --build
# Requiere unos 2,5 GB de RAM libres. Sin GPU, cada respuesta tarda 10-60 s.
services:
  oj-backend:
    environment:
      AI_TUTOR_MODEL_ENABLED: ${AI_TUTOR_MODEL_ENABLED:-1}

  oj-model:
    # llama.cpp con el modelo QLoRA aprobado; sin puertos publicados.
    image: ${MODEL_IMAGE:-ghcr.io/incubadoradesarrollo-source/b-lizard-judge-modelo}:${TUTOR_IMAGE_TAG:-d86aa807275d0778ff12269bc36c3cdf974fdb6b}
    command: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "4096", "-np", "1", "--threads", "${MODEL_THREADS:-4}"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    expose:
      - "8080"

  oj-tutor:
    # Motor interno: comprueba el SHA-256 de los artefactos y filtra cada respuesta.
    image: ${TUTOR_IMAGE:-ghcr.io/incubadoradesarrollo-source/b-lizard-judge-tutor}:${TUTOR_IMAGE_TAG:-d86aa807275d0778ff12269bc36c3cdf974fdb6b}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    environment:
      MODEL_URL: http://oj-model:8080
      MODEL_TIMEOUT_S: ${MODEL_TIMEOUT_S:-25}
      # Plazo de «Proponer con IA» (30-100 s); menor que AI_TUTOR_SUGGEST_TIMEOUT del backend.
      SUGGEST_TIMEOUT_S: ${SUGGEST_TIMEOUT_S:-90}
    expose:
      - "8080"
    depends_on:
      oj-model:
        condition: service_started
