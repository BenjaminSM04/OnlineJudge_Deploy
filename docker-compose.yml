services:

  oj-redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - ./data/redis:/data

  oj-postgres:
    image: postgres:17-alpine
    restart: always
    volumes:
      - pgdata17:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onlinejudge}
      POSTGRES_USER: ${POSTGRES_USER:-onlinejudge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Conserve la contraseña vigente en el entorno privado}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 30

  oj-judge:
    image: registry.cn-hongkong.aliyuncs.com/oj-image/judge:1.6.1@sha256:2dd902870f5e6f69866aa339a6a98b6da9eb1693e2e9936dce23d73203151501
    restart: always
    read_only: true
    cap_drop:
      - SETPCAP
      - MKNOD
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - SETFCAP
      - FSETID
    tmpfs:
      - /tmp
    volumes:
      - ./data/backend/test_case:/test_case:ro
      - ./data/judge_server/log:/log
      - ./data/judge_server/run:/judger
    environment:
      - SERVICE_URL=http://oj-judge:8080
      - BACKEND_URL=http://oj-backend:8000/api/judge_server_heartbeat/
      - TOKEN=${JUDGE_SERVER_TOKEN:?Conserve el token vigente en el entorno privado}
      # - judger_debug=1

  oj-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: oj-backend:local
    restart: always
    depends_on:
      oj-redis: {condition: service_started}
      oj-postgres: {condition: service_healthy}
      oj-judge: {condition: service_started}
    volumes:
      - ./data/backend:/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-onlinejudge}
      - POSTGRES_USER=${POSTGRES_USER:-onlinejudge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Conserve la contraseña vigente en el entorno privado}
      - JUDGE_SERVER_TOKEN=${JUDGE_SERVER_TOKEN:?Conserve el token vigente en el entorno privado}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?Defina los hosts públicos y localhost sin comodines}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-1}
      - TRUST_PROXY_HTTPS=${TRUST_PROXY_HTTPS:-0}
      # - FORCE_HTTPS=1
      # - STATIC_CDN_HOST=cdn.oj.com
    ports:
      - "0.0.0.0:80:8000"
      - "0.0.0.0:443:1443"

volumes:
  # Se conserva la definición histórica; nunca se conecta PostgreSQL 17 a ella.
  pgdata:
  pgdata17:
    external: true
    name: ${OJ_PG17_VOLUME:?Seleccione explícitamente el volumen nuevo restaurado y verificado}
